apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: swanythree
    component: backend
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: swanythree
    component: frontend
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
