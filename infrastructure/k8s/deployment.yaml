apiVersion: apps/v1
kind: Deployment
metadata:
  name: swanythree-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swanythree
      component: backend
  template:
    metadata:
      labels:
        app: swanythree
        component: backend
    spec:
      containers:
      - name: backend
        image: swanythree/backend:latest
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: swanythree-secrets
        resources:
          requests: { memory: "512Mi", cpu: "250m" }
          limits: { memory: "1Gi", cpu: "1000m" }
        livenessProbe:
          httpGet: { path: /health, port: 3001 }
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swanythree-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swanythree
      component: frontend
  template:
    metadata:
      labels:
        app: swanythree
        component: frontend
    spec:
      containers:
      - name: frontend
        image: swanythree/frontend:latest
        ports:
        - containerPort: 3000
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "256Mi", cpu: "250m" }
