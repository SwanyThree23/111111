worker_processes auto;
rtmp_auto_push on;

events { worker_connections 1024; }

rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    application app {
      live on;
      record off;
      on_publish http://localhost:4000/api/streams/on-publish;
      on_done http://localhost:4000/api/streams/on-done;
      push rtmp://localhost:1935/hls;
    }
    application hls {
      live on;
      hls on;
      hls_path /tmp/hls;
      hls_fragment 3;
      hls_playlist_length 60;
    }
  }
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name _;

    location /hls {
      alias /tmp/hls;
      types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }

    location /stat {
      rtmp_stat all;
      rtmp_stat_stylesheet stat.xsl;
    }

    location /control {
      rtmp_control all;
    }
  }
}
