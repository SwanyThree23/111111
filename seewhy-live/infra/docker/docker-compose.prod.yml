version: '3.8'

networks:
  seewhy-net:
    driver: bridge

volumes:
  redis_data:
  hls_data:
  certbot_conf:
  certbot_www:

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [seewhy-net]
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  api:
    image: seewhy/api:latest
    restart: unless-stopped
    networks: [seewhy-net]
    env_file: /opt/seewhy-live/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
    ports:
      - "4000:4000"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',(r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    image: seewhy/web:latest
    restart: unless-stopped
    networks: [seewhy-net]
    env_file: /opt/seewhy-live/.env
    ports:
      - "3000:3000"
    depends_on: [api]

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    networks: [seewhy-net]
    ports:
      - "1935:1935"
      - "8554:8554"
      - "8888:8888"
      - "9997:9997"
    volumes:
      - hls_data:/tmp/hls
    environment:
      MTX_PROTOCOLS: tcp
      MTX_API: "yes"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks: [seewhy-net]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/seewhy-live/infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - hls_data:/tmp/hls:ro
    depends_on: [api, web]

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
